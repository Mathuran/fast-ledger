[workspace]
resolver = "2"
members = [
    "crates/fast-ledger-core",
    "crates/fast-ledger-db",
    "crates/fast-ledger-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
crc32fast = "1.4"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "sync"] }
axum = "0.7"
tower = "0.5"
